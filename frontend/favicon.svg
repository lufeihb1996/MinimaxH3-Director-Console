<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="topGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" ry="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="30" rx="16" ry="16" fill="url(#topGlow)"/>

  <!-- Border Ring -->
  <rect x="2" y="2" width="60" height="60" rx="16" ry="16" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- Film Strip / Cinema Clapperboard Grid -->
  <g filter="url(#dropShadow)" fill="#ffffff">
    <!-- Cinema Frame Body -->
    <rect x="14" y="16" width="36" height="32" rx="5" ry="5" fill="none" stroke="#ffffff" stroke-width="3"/>
    
    <!-- Film Perforations Left -->
    <rect x="17" y="20" width="4" height="4" rx="1"/>
    <rect x="17" y="30" width="4" height="4" rx="1"/>
    <rect x="17" y="40" width="4" height="4" rx="1"/>
    
    <!-- Film Perforations Right -->
    <rect x="43" y="20" width="4" height="4" rx="1"/>
    <rect x="43" y="30" width="4" height="4" rx="1"/>
    <rect x="43" y="40" width="4" height="4" rx="1"/>

    <!-- Center Play Arrow -->
    <polygon points="28,26 39,32 28,38"/>
  </g>
</svg>